[project]
name = "cctv-summariser"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
log_cli_level = "WARNING"
markers = [
    "yolo: runs YOLOv8 inference (downloads weights, slower on CPU-only CI)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
