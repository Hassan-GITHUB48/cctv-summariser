name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build  # includes tsc type-check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cctv
          POSTGRES_PASSWORD: cctv
          POSTGRES_DB: cctv
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cctv -d cctv"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://cctv:cctv@localhost:5433/cctv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1
      - name: Install CPU-only PyTorch (avoids ~2 GB of CUDA wheels)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        # -rs lists skipped tests, so a missing service can't silently hide failures
        run: pytest -rs --durations=10
